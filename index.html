:root{--bg:#0c171a;--surface:#142428;--surface2:#1d3034;--line:#2b4549;--text:#f4f9f7;--muted:#a6b9ba;--lime:#c6f26b;--cyan:#7cd8d0;--red:#ff9c96;--radius:19px}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}.shell{max-width:780px;margin:auto;padding:env(safe-area-inset-top) 16px calc(102px + env(safe-area-inset-bottom))}.header{display:flex;justify-content:space-between;align-items:center;padding:24px 2px 23px}.logo{display:flex;gap:12px;align-items:center}.mark{width:46px;height:46px;border-radius:15px;background:var(--lime);color:#132321;display:grid;place-items:center;font-weight:1000;font-size:24px;transform:rotate(-7deg)}.brand{font-weight:850;font-size:23px;letter-spacing:-.8px}.sub{font-size:12px;color:var(--muted);margin-top:3px}.smallbtn{color:var(--lime);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.eyebrow{text-transform:uppercase;letter-spacing:2px;color:var(--lime);font-size:11px;font-weight:800}.heading{font-size:30px;letter-spacing:-1.2px;margin:7px 0 19px;font-weight:850}.hero{border-radius:25px;padding:23px;position:relative;overflow:hidden;background:linear-gradient(130deg,#294c43 0%,#19322d 66%,#15272b 100%);border:1px solid #3a6255}.hero:after{content:"";position:absolute;width:220px;height:220px;border:1.5px solid #6b988033;border-radius:50%;right:-65px;top:-67px;box-shadow:0 0 0 28px #6b988018,0 0 0 57px #6b988013;pointer-events:none}.hero .big{font-size:49px;letter-spacing:-2px;font-weight:900;margin:10px 0 2px}.hero .big span{font-size:17px;letter-spacing:0;color:#cbe0d2}.hero .detail{color:#cbdad3;font-size:13px}.cta{border:0;background:var(--lime);color:#18301e;font-weight:900;padding:14 s{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#142427f5;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-left)) calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center}.tabs-inner{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;width:100%;max-width:780px}.tab{min-width:0;border:0;background:none;color:var(--muted);display:flex;align-items:center;flex-direction:column;gap:5px;padding:6px 0;font-size:9px;font-weight:700}.tab svg{width:22px;height:22px}.tab.active{color:var(--lime)}.addcircle{color:#172821;background:var(--lime);width:44px;height:44px;border-radius:15px;display:grid;place-items:center;margin:-15px 0 0}.addcircle svg{width:25px;height:25px}.overlay{position:fixed;inset:0;z-index:30;background:#000b;display:none;align-items:end;justify-content:center}.overlay.show{display:flex}.sheet{width:100%;max-width:700px;background:#16272a;border-radius:26px 26px 0 0;padding:20px 18px calc(26px + env(safe-area-inset-bottom));max-height:95dvh;overflow-y:auto;box-shadow:0 -10px 50px #0008}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:21px}.sheethead h2{margin:0;font-size:22px}.xbtn{border:0;background:#2b4144;color:var(--text);border-radius:12px;padding:7px 13px;font-size:20px}.field{margin:0 0 15px}.field label{display:block;font-size:12px;font-weight:800;color:#c0d0cd;margin:0 0 7px}.field input,.field select,.field textarea{width:100%;border:1px solid #3d595b;background:#0e1d20;color:var(--text);padding:13px 12px;border-radius:12px;min-height:47px;color-scheme:dark}.field textarea{resize:vertical;min-height:75px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 11px}.help{font-size:11px;color:var(--muted);margin-top:5px}.fullbtn{width:100%;border:0;border-radius:13px;padding:15px;background:var(--lime);color:#193021;font-weight:850;margin-top:8px}.danger{background:none;color:var(--red);border:1px solid #814 .cal-toolbar{display:flex;align-items:center;justify-content:space-between;text-transform:capitalize;margin:16px 0}.cal-toolbar button{background:var(--surface);color:var(--lime);border:1px solid var(--line);border-radius:11px;font-size:27px;padding:3px 17px}.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:13px 8px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}.cal-week{text-align:center;color:var(--muted);font-size:12px;padding:8px 0}.cal-day{min-width:0;min-height:49px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.cal-day.chosen{background:var(--lime);color:#152722}.cal-day small{font-size:9px}.cal-day.chosen small{color:#152722!important}</style></head><body><main class="shell"><header class="header"><div class="logo"><div class="mark">P</div><div><div class="brand">padelaplace<span style="color:var(--lime)">.</span></div><div class="sub">MON CARNET DE PADEL</div></div></div><button class="smallbtn" onclick="navigate('settings')" aria-label="Réglages">⚙</button></header><div id="app"></div></main><nav class="tabs" aria-label="Navigation principale"><div class="tabs-inner" id="nav"></div></nav><div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><section class="sheet" id="sheet" role="dialog" aria-modal="true"></section></div><input type="file" id="importFile" accept="application/json,.json" hidden onchange="importData(event)"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';const KEY='padelaplace-v1';let db={sessions:[],people:[],gear:[]},page='home',filter='Tous';let calendarMonth=new Date().toLocaleDateString('en-CA').slice(0,7),selectedDay=new Date().toLocaleDateString('en-CA');let editId=null,formType='Entraînement',formStars=4;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();const dateToday=()=>new Date().toLocaleDateString('en-CA');const num=n=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:1}).format(n);const hours=m=>num(m/60);const dateFR=d=>d?new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}):'';const person=id=>db.people.find(p=>p.id===id);const names=ids=>(ids||[]).map(id=>person(id)?.name).filter(Boolean).join(', ');const isPlanned=s=>s.status==='Planifié';const doneSessions=()=>db.sessions.filter(s=>!isPlanned(s));const duration=s=>Number(s.minutes)||0;function load(){try{let v=JSON.parse(localStorage.getItem(activeKey()));if(v&&Array.isArray(v.sessions)&&Array.isArray(v.people)&&Array.isArray(v.gear))db=v}catch(e){}}function save(){try{localStorage.setItem(activeKey(),JSON.stringify(db));if(cloudUser)queueSnapshot()}catch(e){alert('Stockage indisponible : exporte tes données depuis les réglages.')}}function icon(name){let p={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/>',list:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/>',plus:'<path d="M12 5v14M5 12h14"/>',people:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5v1"/>',gear:'<path d="M5 20c6 0 11-5 11-11a6 6 0 0 0-12 0c0 6 5 11 11 11ZM15 20l5 2M16 16l5 5"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p[name]}</svg>`}let budgetPeriod="all";const euro=v=>new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"}).format(Number(v)||0);function navigate(next){page=next;render();window.scrollTo(0,0)}function render(){const tabs=[['home','Accueil','home'],['calendar','Agenda','list'],['budget','Budget','list'],['sessions','Séances','list'],['add','Ajouter','plus'],['people','Joueurs','people'],['gear','Matériel','gear']];$('nav').innerHTML=tabs.map(([id,label,ic])=>`<button class="tab ${page===id?'active':''}" onclick="${id==='add'?"openSession()":`navigate('${id}')`}" aria-label="${label}">${id==='add'?`<span class="addcircle">${icon(ic)}</span>`:icon(ic)}<span>${label}</span></button>`).join('');$('app').innerHTML=({home:homeView,calendar:calendarView,budget:budgetView,sessions:sessionsView,people:peopleView,gear:gearView,settings:settingsView}[page]||homeView)()}
function homeView(){const total=doneSessions().reduce((s,x)=>s+duration(x),0),year=new Date().getFullYear(),thisYear=doneSessions().filter(s=>s.date?.startsWith(year+'-'));let matches=doneSessions().filter(s=>s.type!=='Entraînement'&&s.result),wins=matches.filter(s=>s.result==='Victoire').length;let months=Array.from({length:6},(_,i)=>{let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);let key=d.toLocaleDateString('en-CA').slice(0,7);return{label:d.toLocaleDateString('fr-FR',{month:'short'}),value:doneSessions().filter(s=>s.date?.slice(0,7)===key).reduce((t,s)=>t+duration(s),0)}});let max=Math.max(60,...months.map(x=>x.value));return `<div class="eyebrow">TA PROGRESSION</div><h1 class="heading">À toi de jouer.</h1><div class="hero"><div class="eyebrow" style="color:#dbf0c4">TEMPS TOTAL SUR LE TERRAIN</div><div class="big">${hours(total)} <span>heures</span></div><div class="detail">${doneSessions().length} séance${doneSessions().length>1?'s':''} enregistrée${db.sessions.length>1?'s':''} · ${year}</div><button class="cta" onclick="openSession()">＋ Ajouter une séance</button></div><div class="cards"><div class="stat"><div class="number">${doneSessions().filter(s=>s.type==='Entraînement').length}</div><div class="name">Entraînements</div></div><div class="stat"><div class="number">${doneSessions().filter(s=>s.type==='Match').length}</div><div class="name">Matchs</div></div><div class="stat"><div class="number">${doneSessions().filter(s=>s.type==='Tournoi').length}</div><div class="name">Tournois</div></div></div><div class="sectionhead"><h2>Mon prochain rendez-vous</h2><button class="textbtn" onclick="navigate('calendar')">Agenda →</button></div>${nextSessionCard()}<div class="sectionhead"><h2>Mon budget padel</h2><button class="textbtn" onclick="navigate('budget')">Détails →</button></div><div class="detailblock" onclick="navigate('budget')" style="cursor:pointer"><div class="eyebrow">DÉPENSES TOTALES</div><div class="number" style="font-size:30px;color:var(--lime);margin-top:9px">${euro([...doneSessions()].reduce((a,s)=>a+(Number(s.cost)||0),0)+db.gear.reduce((a,g)=>a+(Number(g.price)||0),0))}</div><div class="itemsub">Matériel, tournois, matchs et entraînements · Voir le détail →</div></div><div class="sectionhead"><h2>6 derniers mois</h2><span class="badgepoint">${hours(thisYear.reduce((s,x)=>s+duration(x),0))} h cette année</span></div><div class="detailblock"><div class="chart">${months.map(m=>`<div class="barcol"><span class="barvalue">${m.value?hours(m.value)+'h':''}</span><div class="bar" style="height:${Math.max(3,Math.round(m.value/max*92))}px;opacity:${m.value?1:.2}"></div><span class="barlabel">${esc(m.label)}</span></div>`).join('')}</div></div><div class="twocol"><div class="stat"><div class="number">${matches.length?Math.round(wins/matches.length*100)+' %':'—'}</div><div class="name">Victoires sur matchs avec résultat</div></div><div class="stat"><div class="number">${db.people.length}</div><div class="name">Joueurs répertoriés</div></div></div><div class="sectionhead"><h2>Dernières séances</h2><button class="textbtn" onclick="navigate('sessions')">Tout voir →</button></div>${sessionList([...doneSessions()].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4))}`}
function budgetView(){const yr=new Date().getFullYear();const years=[...new Set([...db.sessions.map(s=>s.date?.slice(0,4)),...db.gear.map(g=>g.date?.slice(0,4)),String(yr)].filter(x=>/^\d{4}$/.test(x)))].sort().reverse();const inPeriod=x=>budgetPeriod==='all'||x?.slice(0,4)===budgetPeriod;const categories=[{name:'Matériel',icon:'🎒',amount:db.gear.filter(g=>inPeriod(g.date)).reduce((a,g)=>a+(Number(g.price)||0),0),count:db.gear.filter(g=>inPeriod(g.date)&&g.price!=null).length},{name:'Tournois',icon:'🏆',amount:doneSessions().filter(s=>s.type==='Tournoi'&&inPeriod(s.date)).reduce((a,s)=>a+(Number(s.cost)||0),0),count:db.sessions.filter(s=>s.type==='Tournoi'&&inPeriod(s.date)&&s.cost!=null).length},{name:'Matchs',icon:'🎾',amount:doneSessions().filter(s=>s.type==='Match'&&inPeriod(s.date)).reduce((a,s)=>a+(Number(s.cost)||0),0),count:db.sessions.filter(s=>s.type==='Match'&&inPeriod(s.date)&&s.cost!=null).length},{name:'Entraînements',icon:'💪',amount:doneSessions().filter(s=>s.type==='Entraînement'&&inPeriod(s.date)).reduce((a,s)=>a+(Number(s.cost)||0),0),count:db.sessions.filter(s=>s.type==='Entraînement'&&inPeriod(s.date)&&s.cost!=null).length}];const total=categories.reduce((a,c)=>a+c.amount,0);const play=doneSessions().filter(s=>inPeriod(s.date));const mins=play.reduce((a,s)=>a+duration(s),0);const max=Math.max(1,...categories.map(x=>x.amount));return `<div class="eyebrow">STATISTIQUES FINANCIÈRES</div><h1 class="heading">Mon budget padel</h1><div class="field"><label for="budgetYear">Période</label><select id="budgetYear" onchange="budgetPeriod=this.value;render()"><option value="all" ${budgetPeriod==='all'?'selected':''}>Depuis le début</option>${years.map(y=>`<option value="${y}" ${budgetPeriod===y?'selected':''}>${y}</option>`).join('')}</select></div><div class="hero"><div class="eyebrow" style="color:#dbf0c4">TOTAL DÉPENSÉ</div><div class="big" style="font-size:40px">${euro(total)}</div><div class="detail">${budgetPeriod==='all'?'Depuis le début':`Année ${budgetPeriod}`} · Dépenses enregistrées</div></div><div class="sectionhead"><h2>Répartition des dépenses</h2></div><div class="detailblock">${categories.map(c=>`<div style="margin:14px 0 19px"><div style="display:flex;justify-content:space-between;gap:10px;font-weight:750"><span>${c.icon} ${c.name}</span><span>${euro(c.amount)}</span></div><div style="height:9px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:9px 0 5px"><div style="height:100%;border-radius:99px;background:var(--lime);width:${total?c.amount/total*100:0}%"></div></div><div class="itemsub">${c.count} dépense${c.count>1?'s':''} enregistrée${c.count>1?'s':''} · ${total?Math.round(c.amount/total*100):0} % du total</div></div>`).join('')}</div><div class="sectionhead"><h2>Coût de ma pratique</h2></div><div class="twocol"><div class="stat"><div class="number" style="font-size:23px">${mins?euro(total/(mins/60)):'—'}</div><div class="name">Coût par heure jouée</div></div><div class="stat"><div class="number" style="font-size:23px">${play.length?euro(total/play.length):'—'}</div><div class="name">Coût par séance</div></div></div><p class="settingscopy" style="margin-top:16px">Ces chiffres incluent les achats de matériel et les coûts saisis dans tes séances. Les équipements sans date d’achat ne sont comptabilisés que dans « Depuis le début ». Une dépense non saisie n’est pas estimée.</p><div class="detailblock"><h3>Compléter mes dépenses</h3><p class="settingscopy">Ouvre une séance pour renseigner son coût, ou un élément de matériel pour ajouter son prix d’achat.</p><button class="settingsbtn" onclick="navigate('sessions')">Voir mes séances →</button><button class="settingsbtn" onclick="navigate('gear')">Voir mon matériel →</button></div>`}
function sessionList(items){return items.length?`<div class="list">${items.map(s=>`<div class="item" onclick="openSession('${s.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')openSession('${s.id}')"><div class="iconbox">${s.type==='Tournoi'?'🏆':s.type==='Match'?'🎾':'💪'}</div><div class="itemmain"><div class="itemtitle">${esc(s.title||s.type)} ${s.result?`<span class="${s.result==='Victoire'?'win':s.result==='Défaite'?'loss':''}" style="font-size:11px"> · ${esc(s.result)}</span>`:''}</div><div class="itemsub">${dateFR(s.date)}${s.time?` · ${esc(s.time)}`:" · Heure non précisée"} · ${isPlanned(s)?"À venir":hours(duration(s))+" h"}${names([s.partner,...(s.opponents||[])]).trim()?` · ${esc(names([s.partner,...(s.opponents||[])]))}`:''}</div></div><span class="pill ${s.type==='Match'?'match':s.type==='Tournoi'?'tournoi':''}">${isPlanned(s)?"À venir · ":""}${esc(s.type)}</span><span class="arrow">›</span></div>`).join('')}</div>`:`<div class="empty"><strong>Le terrain est prêt !</strong>Enregistre ta première séance pour commencer ton carnet.</div>`}
function sessionsView(){let types=['Tous','Entraînement','Match','Tournoi'],items=[...db.sessions].filter(s=>filter==='Tous'||s.type===filter).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="eyebrow">JOURNAL DE BORD</div><h1 class="heading">Mes séances</h1><div class="filters">${types.map(t=>`<button class="filter ${filter===t?'active':''}" onclick="filter='${t}';render()">${t}</button>`).join('')}</div><div class="sectionhead"><h2>${items.length} séance${items.length>1?'s':''}</h2><button class="textbtn" onclick="openSession()">＋ Ajouter</button></div>${sessionList(items)}`}

function gearView(){return `<div class="eyebrow">TON ÉQUIPEMENT</div><h1 class="heading">Mon matériel</h1><div class="sectionhead"><h2>${db.gear.length} élément${db.gear.length>1?'s':''}</h2><button class="textbtn" onclick="openGear()">＋ Ajouter du matériel</button></div>${db.gear.length?`<div class="list">${db.gear.map(g=>`<div class="item" onclick="openGear('${g.id}')"><div class="iconbox">${g.category==='Raquette'?'🏓':g.category==='Chaussures'?'👟':'🎒'}</div><div class="itemmain"><div class="itemtitle">${esc(g.name)}</div><div class="itemsub">${esc(g.category)}${g.date?' · depuis '+dateFR(g.date):''}${g.notes?' · '+esc(g.notes):''}</div></div><span class="arrow">›</span></div>`).join('')}</div>`:`<div class="empty"><strong>Tout ton équipement au même endroit</strong>Raquettes, chaussures, sacs et accessoires : conserve ton inventaire et tes dates d'achat.</div>`}`}

function calendarShift(n){const [y,m]=calendarMonth.split('-').map(Number),d=new Date(y,m-1+n,1);calendarMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');selectedDay=calendarMonth+'-01';render()}
function calendarPick(d){selectedDay=d;render()}
function calendarView(){const [y,m]=calendarMonth.split('-').map(Number),first=new Date(y,m-1,1),count=new Date(y,m,0).getDate(),offset=(first.getDay()+6)%7;const monthName=first.toLocaleDateString('fr-FR',{month:'long',year:'numeric'}),days=Array.from({length:offset},()=>'<span></span>');for(let i=1;i<=count;i++){let d=calendarMonth+'-'+String(i).padStart(2,'0'),events=db.sessions.filter(s=>s.date===d),planned=events.some(isPlanned);days.push(`<button class="cal-day ${selectedDay===d?'chosen':''}" onclick="calendarPick('${d}')"><b>${i}</b>${events.length?`<small style="color:${planned?'var(--lime)':'var(--cyan)'}">${events.length} ●</small>`:''}</button>`)}let selected=db.sessions.filter(s=>s.date===selectedDay).sort((a,b)=>(a.time||'').localeCompare(b.time||'')),future=db.sessions.filter(s=>isPlanned(s)).sort((a,b)=>sortTime(a).localeCompare(sortTime(b)));return `<div class="eyebrow">TON PLANNING</div><h1 class="heading">Agenda padel</h1><div class="cal-toolbar"><button onclick="calendarShift(-1)">‹</button><strong>${esc(monthName)}</strong><button onclick="calendarShift(1)">›</button></div><div class="cal-grid">${['L','M','M','J','V','S','D'].map(d=>`<span class="cal-week">${d}</span>`).join('')}${days.join('')}</div><div class="sectionhead"><h2>${dateFR(selectedDay)}</h2><button class="textbtn" onclick="openSession()">＋ Planifier</button></div>${selected.length?sessionList(selected):'<div class="empty">Aucune séance ce jour.</div>'}<div class="sectionhead"><h2>Mes rendez-vous planifiés</h2></div>${future.length?sessionList(future):'<div class="empty">Aucun événement planifié.</div>'}<p class="settingscopy">Les événements « À venir » ne sont pas ajoutés aux heures de jeu et aux dépenses avant d’être marqués « Séance effectuée ». Les anciennes séances sans heure restent consultables.</p>`}
function settingsView(){return `<div class="eyebrow">PERSONNALISATION</div><h1 class="heading">Réglages</h1>${cloudSettings()}<div class="detailblock"><h3>Sauvegarder mes données</h3><p class="settingscopy">Une copie locale est conservée. Connecte-toi pour synchroniser tes modifications avec ton compte. Conserve également des exports JSON réguliers.</p><button class="settingsbtn" onclick="exportData()">↗ Exporter mes données (JSON)</button><button class="settingsbtn" onclick="$('importFile').click()">↙ Restaurer une sauvegarde (JSON)</button></div><div class="detailblock"><h3>Installer sur l'iPhone</h3><p class="settingscopy">Une fois l'application hébergée sur une adresse HTTPS, ouvre-la dans Safari, touche Partager puis « Sur l'écran d'accueil ». L'application pourra fonctionner sans connexion après son premier chargement.</p></div><div class="detailblock"><h3>Gestion des données</h3><button class="danger" onclick="resetData()">Effacer les données locales (attention : synchronisation)</button></div><div class="version">Padelaplace · version 1.3 bêta · Synchronisation Supabase</div>`}
function modal(title,content){$('sheet').innerHTML=`<div class="sheethead"><h2>${title}</h2><button class="xbtn" aria-label="Fermer" onclick="closeModal()">×</button></div>${content}`;$('overlay').classList.add('show');document.body.style.overflow='hidden';$('sheet').scrollTop=0}function closeModal(){$('overlay').classList.remove('show');document.body.style.overflow=''}function field(label,id,val='',type='text',extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val)}" ${extra}></div>`}function options(id,arr,val='',extra=''){return `<div class="field"><label for="${id}">${extra||id}</label><select id="${id}">${arr.map(([v,t])=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`}function personOptions(selected='',placeholder='— Aucun —'){return [[ '',placeholder],...db.people.map(p=>[p.id,p.name])].map(([v,t])=>`<option value="${esc(v)}" ${selected===v?'selected':''}>${esc(t)}</option>`).join('')}function typeSet(t){formType=t;document.querySelectorAll('.typechoice').forEach(b=>b.classList.toggle('active',b.dataset.type===t));$('matchFields').style.display=t==='Entraînement'?'none':'block';$('personFields').style.display=t==='Entraînement'?'none':'block'}
function openSession(id){editId=id||null;let s=db.sessions.find(s=>s.id===id)||{type:'Entraînement',date:selectedDay||dateToday(),time:'',status:'Terminé',minutes:90,opponents:[]};formType=s.type;let gearOpts=[['','— Aucun —'],...db.gear.map(g=>[g.id,g.name])];modal(id?'Modifier la séance':'Nouvelle séance',`<form onsubmit="saveSession(event)"><div class="type-row">${['Entraînement','Match','Tournoi'].map(t=>`<button type="button" class="typechoice ${s.type===t?'active':''}" data-type="${t}" onclick="typeSet('${t}')">${t}</button>`).join('')}</div><div class="formgrid">${field('Date','fDate',s.date,'date','required')}${field('Heure de début','fTime',s.time||'','time')}${field('Durée (minutes)','fMinutes',s.minutes,'number','min="1" max="1440" required')}${options('fStatus',[['Terminé','Séance effectuée'],['Planifié','À venir / réservé']],s.status||'Terminé','Statut')}</div>${field('Titre ou lieu (facultatif)','fTitle',s.title||'','text','placeholder="Ex. Padel Club Monthey"')}<div id="personFields" style="display:${s.type==='Entraînement'?'none':'block'}"><div class="field"><label>Partenaire</label><select id="fPartner">${personOptions(s.partner)}</select></div><div class="formgrid"><div class="field"><label>Adversaire 1</label><select id="fOpponent1">${personOptions(s.opponents?.[0])}</select></div><div class="field"><label>Adversaire 2</label><select id="fOpponent2">${personOptions(s.opponents?.[1])}</select></div></div><div class="help" style="margin:-7px 0 12px">Crée les fiches des joueurs dans l'onglet « Joueurs » avant de les sélectionner.</div></div><div id="matchFields" style="display:${s.type==='Entraînement'?'none':'block'}">${options('fResult',[['','— Non renseigné —'],['Victoire','Victoire'],['Défaite','Défaite'],['Nul','Nul']],s.result||'','Résultat')}${field('Score (facultatif)','fScore',s.score||'','text','placeholder="Ex. 6-4, 6-3"')}</div>${options('fGear',gearOpts,s.gear||'','Matériel utilisé')}${field('Dépense (facultative, €)','fCost',s.cost??'','number','min="0" step="0.01"')}<div class="field"><label for="fNotes">Notes / progrès / sensations</label><textarea id="fNotes" placeholder="Ex. Meilleure volée, travail du placement...">${esc(s.notes||'')}</textarea></div><button type="submit" class="fullbtn">${id?'Enregistrer les modifications':'Enregistrer la séance'}</button>${id?`<button type="button" class="danger" onclick="deleteEntry('sessions','${id}')">Supprimer cette séance</button>`:''}</form>`)}
function saveSession(e){e.preventDefault();let s={id:editId||uid(),type:formType,date:$('fDate').value,time:$('fTime').value,status:$('fStatus').value,minutes:Number($('fMinutes').value),title:$('fTitle').value.trim(),partner:formType==='Entraînement'?'':$('fPartner').value,opponents:formType==='Entraînement'?[]:[$('fOpponent1').value,$('fOpponent2').value].filter(Boolean),result:formType==='Entraînement'?'':$('fResult').value,score:formType==='Entraînement'?'':$('fScore').value.trim(),gear:$('fGear').value,cost:$('fCost').value===''?null:Number($('fCost').value),notes:$('fNotes').value.trim()};if(!s.date||s.minutes<1||s.minutes>1440){alert('Vérifie la date et la durée.');return}if(s.opponents.length!==new Set(s.opponents).size||(s.partner&&s.opponents.includes(s.partner))){alert('Un joueur ne peut pas figurer plusieurs fois dans le même match.');return}let i=db.sessions.findIndex(x=>x.id===s.id);if(i===-1)db.sessions.push(s);else db.sessions[i]=s;save();closeModal();navigate('calendar')}
function starSet(n){formStars=n;$('starRating').innerHTML=Array.from({length:7},(_,i)=>`<button type="button" class="star ${i<n?'on':''}" onclick="starSet(${i+1})" aria-label="${i+1} étoiles">★</button>`).join('')}
function openPerson(id){editId=id||null;let p=db.people.find(x=>x.id===id)||{stars:4,role:'Les deux'};formStars=p.stars||4;let count=db.sessions.filter(s=>s.partner===id||(s.opponents||[]).includes(id)).length;modal(id?'Modifier le joueur':'Ajouter un joueur',`<form onsubmit="savePerson(event)">${field('Nom ou surnom','pName',p.name||'','text','required maxlength="80"')}${options('pRole',[['Les deux','Partenaire et adversaire'],['Partenaire','Partenaire'],['Adversaire','Adversaire']],p.role,'Rôle habituel')}<div class="field"><label>Niveau estimé · ${formStars}/7 étoiles</label><div class="stars" id="starRating"></div></div><div class="field"><label>Notes</label><textarea id="pNotes" placeholder="Style de jeu, points forts, club...">${esc(p.notes||'')}</textarea></div>${id?`<div class="detailblock">${count} séance${count>1?'s':''} ensemble ou face à face</div>`:''}<button class="fullbtn" type="submit">Enregistrer</button>${id?`<button class="danger" type="button" onclick="deleteEntry('people','${id}')">Supprimer ce joueur</button>`:''}</form>`);starSet(formStars)}function savePerson(e){e.preventDefault();let p={id:editId||uid(),name:$('pName').value.trim(),role:$('pRole').value,stars:formStars,notes:$('pNotes').value.trim()};if(!p.name)return;let i=db.people.findIndex(x=>x.id===p.id);if(i<0)db.people.push(p);else db.people[i]=p;save();closeModal();navigate('people')}
function openGear(id){editId=id||null;let g=db.gear.find(x=>x.id===id)||{category:'Raquette'};modal(id?'Modifier le matériel':'Ajouter du matériel',`<form onsubmit="saveGear(event)">${field('Marque et modèle','gName',g.name||'','text','required maxlength="100"')}${options('gCategory',['Raquette','Chaussures','Sac','Vêtements','Accessoire','Autre'].map(x=>[x,x]),g.category,'Catégorie')}${field('Date d’achat (facultatif)','gDate',g.date||'','date')}${field('Prix d’achat (facultatif, €)','gPrice',g.price??'','number','min="0" step="0.01"')}<div class="field"><label>Notes / état</label><textarea id="gNotes" placeholder="Ex. Grip changé, raquette principale...">${esc(g.notes||'')}</textarea></div><button type="submit" class="fullbtn">Enregistrer</button>${id?`<button type="button" class="danger" onclick="deleteEntry('gear','${id}')">Supprimer cet équipement</button>`:''}</form>`)}function saveGear(e){e.preventDefault();let g={id:editId||uid(),name:$('gName').value.trim(),category:$('gCategory').value,date:$('gDate').value,price:$('gPrice').value===''?null:Number($('gPrice').value),notes:$('gNotes').value.trim()};if(!g.name)return;let i=db.gear.findIndex(x=>x.id===g.id);if(i<0)db.gear.push(g);else db.gear[i]=g;save();closeModal();navigate('gear')}
function deleteEntry(type,id){if(!confirm('Supprimer définitivement cet élément ?'))return;db[type]=db[type].filter(x=>x.id!==id);if(cloudUser)queueDeletion(type,id);save();closeModal();render()}function exportData(){let blob=new Blob([JSON.stringify({app:'Padelaplace',version:1,exportedAt:new Date().toISOString(),...db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`padelaplace-sauvegarde-${dateToday()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(ev){let f=ev.target.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!['sessions','people','gear'].every(k=>Array.isArray(d[k])))throw Error('Format incorrect');if(!confirm('Remplacer les données actuellement stockées par cette sauvegarde ?'))return;db={sessions:d.sessions,people:d.people,gear:d.gear};save();navigate('home');alert('Sauvegarde restaurée.')}catch(e){alert('Fichier de sauvegarde invalide.')}finally{ev.target.value=''}}function resetData(){if(cloudUser){alert('Pour protéger les données synchronisées, la suppression globale est désactivée lorsque tu es connecté. Supprime les éléments individuellement.');return}if(confirm('Effacer toutes les séances, les joueurs et le matériel ? Cette action est irréversible.')){db={sessions:[],people:[],gear:[]};save();navigate('home')}}

function cloudSettings(){return `<div class="detailblock"><h3>☁️ Mon compte et synchronisation</h3><p class="settingscopy">${esc(cloudStatus)}. Chaque compte dispose de ses propres données. La version locale d'origine n'est jamais transférée automatiquement.</p>${cloudUser?`<p class="settingscopy">Connecté : <strong>${esc(cloudUser.email||'Compte')}</strong></p><button class="settingsbtn" onclick="syncCloud(true)">↻ Synchroniser maintenant</button><button class="settingsbtn" onclick="document.getElementById('importFile').click()">↙ Importer ma sauvegarde JSON dans ce compte</button><button class="settingsbtn" onclick="signOutCloud()">Se déconnecter</button>`:`<div class="field"><label for="authEmail">Adresse e-mail</label><input id="authEmail" type="email" autocomplete="email" placeholder="ton@email.fr"></div><div class="field"><label for="authPassword">Mot de passe (au moins 6 caractères)</label><input id="authPassword" type="password" autocomplete="current-password"></div><button class="settingsbtn" onclick="signInCloud(false)">Se connecter</button><button class="settingsbtn" onclick="signInCloud(true)">Créer un compte</button>`}</div>`}
function pending(){try{return JSON.parse(localStorage.getItem(queueKey())||'{}')}catch(e){return {}}}

function queueSnapshot(){if(!cloudUser)return;let p=pending();for(const type of Object.keys(TABLES)){p[type] ||= {};for(const item of db[type])if(item.id)p[type][item.id]={action:'upsert',item};}writePending(p);cloudStatus='Modifications locales en attente';if(navigator.onLine)syncCloud(false)}
function queueDeletion(type,id){if(!cloudUser)return;let p=pending();p[type] ||= {};p[type][id]={action:'delete'};writePending(p)}

async function signInCloud(signup){let client=makeClient();if(!client){render();return}let email=document.getElementById('authEmail')?.value.trim(),password=document.getElementById('authPassword')?.value;if(!email||!password){alert('Renseigne ton e-mail et ton mot de passe.');return}if(password.length<6){alert('Mot de passe trop court.');return}try{let {data,error}=signup?await client.auth.signUp({email,password}):await client.auth.signInWithPassword({email,password});if(error)throw error;if(data.session){await activateCloud(data.user);await syncCloud(true)}else{alert('Compte créé. Vérifie ton e-mail et confirme ton inscription avant de te connecter.')}render()}catch(e){alert('Connexion impossible : '+e.message)}}

async function syncCloud(showMessage){if(!cloudUser||cloudBusy||!navigator.onLine)return;let client=makeClient();if(!client)return;cloudBusy=true;cloudStatus='Synchronisation en cours';try{
 let p=pending();for(const [type,table] of Object.entries(TABLES)){

   if(result.error)throw result.error;

  }
 }
 let merged={sessions:[],people:[],gear:[]};for(const [type,table] of Object.entries(TABLES)){

  for(const item of db[type])if(item.id&&!map.has(item.id))map.set(item.id,item);
  merged[type]=[...map.values()];
 }

 }catch(e){cloudStatus='Échec de synchronisation : '+e.message;if(showMessage)alert(cloudStatus)}finally{cloudBusy=false;if(page==='settings')render()}}
